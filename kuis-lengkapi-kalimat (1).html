<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ayo Lengkapi Kalimat!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');

  :root{
    --sky-top:#8FD8FF;
    --sky-bottom:#EAF9FF;
    --sun:#FFC94A;
    --grass:#6FCB6E;
    --grass-dark:#4FAE55;
    --coral:#FF7A66;
    --coral-dark:#E9604D;
    --ink:#2E3A45;
    --card:#FFFFFF;
    --blue-btn:#4EC6E0;
    --blue-btn-dark:#33ABC5;
    --purple:#8C7AE6;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
  }

  body{
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, #FFF6DE 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    overflow-x:hidden;
  }

  /* decorative clouds */
  .cloud{
    position:fixed;
    background:#fff;
    border-radius:50px;
    opacity:0.85;
    filter:blur(0.5px);
    z-index:0;
    pointer-events:none;
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
  }
  .c1{width:110px;height:40px; top:6%; left:6%;}
  .c1::before{width:60px;height:60px; top:-30px; left:10px;}
  .c1::after{width:45px;height:45px; top:-20px; left:55px;}
  .c2{width:90px;height:34px; top:12%; right:8%;}
  .c2::before{width:50px;height:50px; top:-26px; left:8px;}
  .c2::after{width:36px;height:36px; top:-16px; left:44px;}
  .c3{width:80px;height:30px; bottom:8%; left:10%;}
  .c3::before{width:44px;height:44px; top:-22px; left:8px;}
  .c3::after{width:32px;height:32px; top:-14px; left:40px;}

  .sun{
    position:fixed;
    top:5%;
    right:6%;
    width:70px;
    height:70px;
    background:var(--sun);
    border-radius:50%;
    box-shadow:0 0 0 10px rgba(255,201,74,0.35);
    z-index:0;
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
  }

  .card{
    background:var(--card);
    border-radius:32px;
    padding:36px 28px 30px;
    box-shadow:0 18px 0 -6px rgba(46,58,69,0.08), 0 24px 40px rgba(46,58,69,0.18);
    text-align:center;
    position:relative;
  }

  /* ---------- START SCREEN ---------- */
  #start-screen h1{
    font-family:'Fredoka', sans-serif;
    font-size:clamp(28px, 6vw, 38px);
    color:var(--purple);
    margin:6px 0 14px;
    line-height:1.25;
  }
  .start-emoji{
    font-size:64px;
    margin-bottom:6px;
    line-height:1;
  }
  #start-screen p{
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 28px;
    line-height:1.5;
  }

  .big-btn{
    font-family:'Fredoka', sans-serif;
    font-size:24px;
    font-weight:600;
    color:#fff;
    background:var(--grass);
    border:none;
    border-radius:24px;
    padding:20px 48px;
    cursor:pointer;
    box-shadow:0 8px 0 var(--grass-dark);
    transition:transform 0.08s ease;
    min-height:60px;
  }
  .big-btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 var(--grass-dark);
  }

  /* ---------- QUIZ SCREEN ---------- */
  #quiz-screen{ display:none; }

  .quiz-header h2{
    font-family:'Fredoka', sans-serif;
    font-size:22px;
    color:var(--purple);
    margin:0 0 4px;
  }
  .soal-label{
    font-weight:800;
    font-size:16px;
    color:var(--blue-btn-dark);
    margin-bottom:10px;
  }

  .progress-track{
    width:100%;
    height:16px;
    background:#E7F2F5;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--sun), var(--coral));
    border-radius:999px;
    transition:width 0.4s ease;
  }

  .picture-badge{
    width:150px;
    height:150px;
    border-radius:50%;
    background:#FFF3DA;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 22px;
    border:6px solid #FFE4A8;
    padding:14px;
  }
  .picture-badge svg{
    width:100%;
    height:100%;
    overflow:visible;
  }

  .sentence{
    font-family:'Fredoka', sans-serif;
    font-size:clamp(24px, 6vw, 30px);
    font-weight:600;
    color:var(--ink);
    margin:0 0 26px;
    line-height:1.4;
  }
  .blank{
    display:inline-block;
    min-width:70px;
    border-bottom:5px dashed #B9C6CC;
    padding:0 6px;
  }
  .blank.filled{
    border-bottom-style:solid;
  }
  .blank.correct{ color:var(--grass-dark); border-color:var(--grass-dark); }
  .blank.wrong{ color:var(--coral-dark); border-color:var(--coral-dark); text-decoration:line-through; }

  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:6px;
  }

  .opt-btn{
    font-family:'Fredoka', sans-serif;
    font-size:20px;
    font-weight:600;
    color:var(--ink);
    background:#F1FAFF;
    border:3px solid #CFEBF8;
    border-radius:20px;
    padding:16px 10px;
    min-height:64px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform 0.08s ease, background 0.15s ease;
  }
  .opt-btn .emoji{ font-size:26px; }
  .opt-btn:hover:not(:disabled){
    background:#E2F5FF;
    transform:translateY(-2px);
  }
  .opt-btn:active:not(:disabled){ transform:translateY(1px); }
  .opt-btn:disabled{ cursor:default; }

  .opt-btn.pick-correct{
    background:#E4F8E6;
    border-color:var(--grass);
    color:var(--grass-dark);
  }
  .opt-btn.pick-wrong{
    background:#FFE9E5;
    border-color:var(--coral);
    color:var(--coral-dark);
  }
  .opt-btn.reveal-correct{
    background:#E4F8E6;
    border-color:var(--grass);
    color:var(--grass-dark);
  }

  .feedback{
    margin-top:20px;
    min-height:74px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .feedback-msg{
    font-family:'Fredoka', sans-serif;
    font-size:24px;
    font-weight:700;
    display:none;
    align-items:center;
    gap:10px;
    padding:10px 22px;
    border-radius:18px;
  }
  .feedback-msg.show{ display:flex; animation:pop 0.35s ease; }
  .feedback-msg.correct{ background:#E4F8E6; color:var(--grass-dark); }
  .feedback-msg.wrong{ background:#FFE9E5; color:var(--coral-dark); }

  @keyframes pop{
    0%{ transform:scale(0.7); opacity:0; }
    60%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }

  .next-btn{
    font-family:'Fredoka', sans-serif;
    font-size:20px;
    font-weight:600;
    color:#fff;
    background:var(--blue-btn);
    border:none;
    border-radius:20px;
    padding:14px 34px;
    cursor:pointer;
    box-shadow:0 6px 0 var(--blue-btn-dark);
    display:none;
    min-height:56px;
  }
  .next-btn.show{ display:inline-block; }
  .next-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--blue-btn-dark); }

  /* ---------- RESULT SCREEN ---------- */
  #result-screen{ display:none; }
  .result-emoji{ font-size:70px; margin-bottom:6px; }
  #result-screen h1{
    font-family:'Fredoka', sans-serif;
    font-size:32px;
    color:var(--purple);
    margin:0 0 18px;
  }
  .score-box{
    font-family:'Fredoka', sans-serif;
    font-size:42px;
    font-weight:700;
    color:var(--grass-dark);
    background:#F1FAFF;
    border-radius:20px;
    padding:18px 10px;
    margin-bottom:16px;
    border:4px solid #CFEBF8;
  }
  .score-msg{
    font-size:20px;
    font-weight:800;
    color:var(--ink);
    margin-bottom:28px;
  }

  @media (max-width:420px){
    .card{ padding:28px 18px 24px; border-radius:26px; }
    .options{ gap:12px; }
    .opt-btn{ font-size:17px; padding:14px 6px; }
    .picture-badge{ width:100px; height:100px; font-size:54px; }
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<div class="stage">

  <!-- START SCREEN -->
  <div class="card" id="start-screen">
    <div class="start-emoji">📚✨</div>
    <h1>Ayo Lengkapi Kalimat!</h1>
    <p>Klik kata yang tepat<br>untuk melengkapi kalimat.</p>
    <button class="big-btn" id="btn-mulai">MULAI</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="card" id="quiz-screen">
    <div class="quiz-header">
      <h2>Ayo Lengkapi Kalimat!</h2>
      <div class="soal-label" id="soal-label">Soal 1 dari 10</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:10%"></div>
    </div>

    <div class="picture-badge" id="picture-badge"></div>
    <div class="sentence" id="sentence"></div>

    <div class="options" id="options"></div>

    <div class="feedback">
      <div class="feedback-msg" id="feedback-msg"></div>
      <button class="next-btn" id="btn-next">Lanjut →</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="card" id="result-screen">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <h1>Hebat!</h1>
    <div class="score-box" id="score-box">Skormu: 0 / 10</div>
    <div class="score-msg" id="score-msg">Hebat sekali!</div>
    <button class="big-btn" id="btn-ulang">Coba Lagi</button>
  </div>

</div>

<script>
  // ---------- DATA BANK: 10 soal tervalidasi (anti-ambigu) ----------

  const SCORE_MESSAGES = [
    { min:9, max:10, msg:"Hebat sekali!" },

  let quizOrder = [];
  let currentIndex = 0;
  let score = 0;
  let answered = false;

  const startScreen = document.getElementById('start-screen');
  const quizScreen = document.getElementById('quiz-screen');
  const resultScreen = document.getElementById('result-screen');

  const soalLabel = document.getElementById('soal-label');
  const progressFill = document.getElementById('progress-fill');
  const pictureBadge = document.getElementById('picture-badge');
  const sentenceEl = document.getElementById('sentence');
  const optionsEl = document.getElementById('options');
  const feedbackMsg = document.getElementById('feedback-msg');
  const btnNext = document.getElementById('btn-next');

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startQuiz(){
    quizOrder = shuffle(QUESTIONS_BANK);
    currentIndex = 0;
    score = 0;
    startScreen.style.display = 'none';
    resultScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    loadQuestion();
  }

  function loadQuestion(){
    answered = false;
    const q = quizOrder[currentIndex];
    const total = quizOrder.length;

    soalLabel.textContent = `Soal ${currentIndex + 1} dari ${total}`;
    progressFill.style.width = `${((currentIndex) / total) * 100 + (100/total)}%`;
    pictureBadge.innerHTML = ICONS[q.icon] || '';

    sentenceEl.innerHTML = q.sentence.replace('___', '<span class="blank" id="blank-slot">___</span>');

    const shuffledOptions = shuffle(q.options);
    optionsEl.innerHTML = '';
    shuffledOptions.forEach(word => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="emoji">${EMOJI[word] || '❔'}</span><span>${word}</span>`;
      btn.addEventListener('click', () => selectAnswer(btn, word, q.answer));
      optionsEl.appendChild(btn);
    });

    feedbackMsg.className = 'feedback-msg';
    feedbackMsg.innerHTML = '';
    btnNext.classList.remove('show');
  }

  function selectAnswer(btn, chosen, correct){
    if(answered) return;
    answered = true;

    const isCorrect = chosen === correct;
    if(isCorrect) score++;

    const blank = document.getElementById('blank-slot');
    blank.textContent = chosen;
    blank.classList.add('filled', isCorrect ? 'correct' : 'wrong');

    Array.from(optionsEl.children).forEach(b => {
      b.disabled = true;
      const word = b.querySelector('span:last-child').textContent;
      if(word === correct){
        b.classList.add(isCorrect ? 'pick-correct' : 'reveal-correct');
      } else if(b === btn){
        b.classList.add('pick-wrong');
      }
    });

    feedbackMsg.className = 'feedback-msg show ' + (isCorrect ? 'correct' : 'wrong');
    feedbackMsg.innerHTML = isCorrect
      ? '✓&nbsp; BENAR!'
      : `✗&nbsp; BELUM TEPAT`;

    btnNext.classList.add('show');
  }

  function nextQuestion(){
    currentIndex++;
    if(currentIndex >= quizOrder.length){
      showResult();
    } else {
      loadQuestion();
    }
  }

  function showResult(){
    quizScreen.style.display = 'none';
    resultScreen.style.display = 'block';

    document.getElementById('score-box').textContent = `Skormu: ${score} / ${quizOrder.length}`;
    const found = SCORE_MESSAGES.find(m => score >= m.min && score <= m.max);
    document.getElementById('score-msg').textContent = found ? found.msg : '';
    document.getElementById('result-emoji').textContent = score >= 7 ? '🎉' : '💪';
  }

  document.getElementById('btn-mulai').addEventListener('click', startQuiz);
  document.getElementById('btn-next').addEventListener('click', nextQuestion);
  document.getElementById('btn-ulang').addEventListener('click', startQuiz);
</script>

</body>
</html>
